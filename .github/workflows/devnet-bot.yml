name: Devnet Trading Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/strategy_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CASH_WALLET_SECRET: ${{ secrets.CASH_WALLET_SECRET }}
          POSITION_WALLET_SECRET: ${{ secrets.POSITION_WALLET_SECRET }}
          TRANSFER_AMOUNT_SOL: "0.5"
          BUY_DIP_PCT: "2.0"
          TAKE_PROFIT_PCT: "3.0"
          STOP_LOSS_PCT: "2.0"

      - name: Commit updated portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/portfolio_state.json
          git diff --staged --quiet || git commit -m "chore: update devnet portfolio state"
          git push
